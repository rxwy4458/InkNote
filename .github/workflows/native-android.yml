name: Native Android ink preview

on:
  workflow_dispatch:
  push:
    branches: [codex/native-ink-oneplus-pad2pro]
    paths: ['mobile/native-android/**', '.github/workflows/native-android.yml']
  pull_request:
    paths: ['mobile/native-android/**', '.github/workflows/native-android.yml']

permissions:
  contents: read

concurrency:
  group: native-ink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native app and instrumented tests
        working-directory: mobile/native-android
        run: |
          chmod +x ../android/gradlew
          ../android/gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native input, storage, PDF and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd mobile/native-android && ../android/gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p native-dist
            adb pull /sdcard/Android/data/com.inknote.nativepreview/files/native-library.png native-dist/
            adb pull /sdcard/Android/data/com.inknote.nativepreview/files/native-editor.png native-dist/
      - name: Collect installable APK and test evidence
        if: always()
        run: |
          mkdir -p native-dist
          if [ -f mobile/native-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/native-android/app/build/outputs/apk/debug/app-debug.apk native-dist/InkNote-Native-Preview-0.1.0.apk
            sha256sum native-dist/*.apk > native-dist/SHA256.txt
            APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$APK_SIGNER" verify --verbose native-dist/*.apk > native-dist/signature.txt
            unzip -l native-dist/*.apk > native-dist/apk-contents.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InkNote-Native-Preview
          path: |
            native-dist/
            mobile/native-android/app/build/reports/
            mobile/native-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
