name: Build InkNote for Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install, launch and uninstall the built package
        shell: powershell
        run: ./scripts/verify-windows-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InkNote-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
