<h1>需要更新「Android System WebView」</h1>
<p>墨页用手机自带的网页组件（Android System WebView）来显示页面。这台手机上的版本太旧，墨页无法正常运行。</p>
<ol>
 <li>打开手机的应用商店（Google Play、华为应用市场、小米应用商店等），搜索「Android System WebView」或「WebView」，点更新；</li>
 <li>如果找不到，也可以更新「Chrome 浏览器」，或在「设置 → 系统更新」里更新系统；</li>
 <li>更新完成后，完全关闭墨页再重新打开。</li>
</ol>
<p class="note">需要 WebView 111 或更新的版本。你的笔记不会受影响，更新后就能看到。</p>
</body>
